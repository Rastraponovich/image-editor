name: CI/CD

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Проверки: тесты, линтинг, сборка
  checks:
    name: Проверки (тесты, линтинг, сборка)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск линтинга
        run: npm run lint

      - name: Запуск тестов
        run: npm run test

      - name: Проверка сборки
        run: npm run build

      - name: Загрузка артефактов сборки
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Деплой на GitHub Pages (только при push в master)
  deploy:
    name: Деплой на GitHub Pages
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка проекта
        run: npm run build

      - name: Настройка Pages
        uses: actions/configure-pages@v4

      - name: Загрузка артефактов
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
