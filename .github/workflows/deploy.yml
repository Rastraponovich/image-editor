name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Deploy only if CI completed successfully
    # Filtering by master branch is already done in workflow_run.branches
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build project
        env:
          NODE_ENV: production
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          export VITE_BASE_PATH="/$REPO_NAME"
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Health check after deployment
        run: |
          DEPLOY_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking availability: $DEPLOY_URL"

          # Install curl if missing (usually already installed)
          if ! command -v curl &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y curl
          fi

          for i in {1..3}; do
            echo "Attempt $i of 3..."
            HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 --location "$DEPLOY_URL" || echo "000")
            if echo "$HTTP_CODE" | grep -qE "^(200|201|301|302|304)$"; then
              echo "✅ Site is available! HTTP code: $HTTP_CODE"
              exit 0
            fi
            echo "⚠️  HTTP code: $HTTP_CODE"
            if [ $i -lt 3 ]; then
              echo "⏳ Waiting 5 seconds before next attempt..."
              sleep 5
            fi
          done

          echo "❌ Site is not available after 3 attempts"
          exit 1
