name: CI/CD

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Линтинг (fail-fast)
  lint:
    name: Линтинг
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск линтинга
        run: npm run lint

  # Проверка типов TypeScript (fail-fast)
  type-check:
    name: Проверка типов
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов TypeScript
        run: npx tsc --noEmit

  # Тесты
  test:
    name: Тесты
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск тестов
        run: npm run test

  # Сборка проекта (зависит от всех проверок)
  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка проекта
        env:
          NODE_ENV: production
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          export VITE_BASE_PATH="/$REPO_NAME"
          npm run build

      - name: Загрузка артефактов сборки
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Деплой на GitHub Pages (только при push в master)
  deploy:
    name: Деплой на GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Скачивание артефактов сборки
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Настройка Pages
        uses: actions/configure-pages@v4

      - name: Загрузка артефактов
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Health check после деплоя
        run: |
          DEPLOY_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Проверка доступности: $DEPLOY_URL"

          # Установка curl если отсутствует (обычно уже установлен)
          if ! command -v curl &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y curl
          fi

          for i in {1..3}; do
            echo "Попытка $i из 3..."
            HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 --location "$DEPLOY_URL" || echo "000")
            if echo "$HTTP_CODE" | grep -qE "^(200|201|301|302|304)$"; then
              echo "✅ Сайт доступен! HTTP код: $HTTP_CODE"
              exit 0
            fi
            echo "⚠️  HTTP код: $HTTP_CODE"
            if [ $i -lt 3 ]; then
              echo "⏳ Ожидание 5 секунд перед следующей попыткой..."
              sleep 5
            fi
          done

          echo "❌ Сайт недоступен после 3 попыток"
          exit 1
