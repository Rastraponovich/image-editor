name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  # Linting (fail-fast)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run linter
        run: npm run lint

  # TypeScript type checking (fail-fast)
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # Tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run tests
        run: npm run test

  # Build project (depends on all checks)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build project
        env:
          NODE_ENV: production
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          export VITE_BASE_PATH="/$REPO_NAME"
          npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # All checks passed - required for merge
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed successfully"
